<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR First-Aid Kit Trainer</title>

    <!-- Importing A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Importing MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<!-- Rotate the 3D model using mouse drag events. -->
<body>

    <!--Button to start traininig-->
    <button id="startTraining">
        Start Training
    </button>

    <!-- Container for training mode buttons -->
    <div id="trainingButtonsContainer" class="button-container">
        <button id="viewItemsButton" class="training-button">
            View Items
        </button>
        <button id="scenarioButton" class="training-button">
            Scenario
        </button>
    </div>

    <!-- Instruction button that appears when item is placed -->
    <button id="instructionButton" >
        Apply item
    </button>

    <!-- Marker-based 3D Scene (MindAR) - untouched, still handles Start Training / View Items -->
    <a-scene
        id="markerScene"
        mindar-image="imageTargetSrc: ./new_target.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Load the background image and all the asset models-->
        <a-assets>
            <img
                id="shelfImage"
                src="assets/images/new_marker.jpg">

            <a-asset-item
                id="firstAidBox"
                src="assets/models/first_aid_box_0_1.glb">
            </a-asset-item>

            <a-asset-item
                id="bandAid"
                src="assets/models/band_aid_box.glb">
            </a-asset-item>

            <a-asset-item
                id="bandageRoll"
                src="assets/models/bandage_roll.glb">
            </a-asset-item>

            <a-asset-item
                id="painBalm"
                src="assets/models/pain_balm.glb">
            </a-asset-item>

            <a-asset-item
                id="paracetamol"
                src="assets/models/paracetamol.glb">
            </a-asset-item>

            <a-asset-item
                id="sprit"
                src="assets/models/sprit.glb">
            </a-asset-item>

            <a-asset-item
                id="thermometer"
                src="assets/models/thermometer.glb">
            </a-asset-item>

            <a-asset-item
                id="bloodHand"
                src="assets/models/blood_hand.glb">
            </a-asset-item>
        </a-assets>

        <!--Add the camera in the center-->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">

            <a-entity
                cursor="rayOrigin: mouse"
                raycaster="objects: .draggable; far: 1000">
            </a-entity>

        </a-camera>

        <!--Initialize the placements of all the entities in the 3D scene-->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <a-image
                src="#shelfImage"
                position="0 0 0"
                width="1"
                height="0.6">
            </a-image>

            <a-entity
                gltf-model="#firstAidBox"
                position="-0.3 -0.06 0"
                scale="0.5 0.5 0.5">
            </a-entity>

            <a-entity
                id="bandAidObject"
                position="0.1 -0.13 0"
                scale="0.008 0.008 0.008"
                draggable-object="target: [mindar-image-target]; itemName: bandAid">

                <a-entity
                    gltf-model="#bandAid">
                </a-entity>

                <a-box
                    class="draggable"
                    width="10"
                    height="10"
                    depth="10"
                    material="transparent: true; opacity: 0; depthWrite: false">
                </a-box>

            </a-entity>

            <!-- Podium that appears when training starts -->
            <a-entity
                id="podium"
                position="-0.1 -0.3 0.2"
                visible="false">
                
                <!-- Podium base -->
                <a-box
                    id="podiumBase"
                    width="0.1"
                    height="0.15"
                    depth="0.3"
                    material="color: #4CAF50; metalness: 0.3; roughness: 0.7">
                </a-box>
                
                <!-- Podium top surface (drop zone) -->
                <a-cylinder
                    id="podiumTop"
                    radius="0.15"
                    height="0.02"
                    position="0 0.08 0"
                    material="color: #45a049; emissive: #1a3a1a; metalness: 0.5">
                </a-cylinder>

            </a-entity>

            <a-entity
                gltf-model="#bandageRoll"
                id="bandageRollObject"
                rotation="0 45 0"
                position="0.3 -0.09 0"
                scale="0.05 0.05 0.05"
                draggable-object="target: [mindar-image-target]; itemName: bandageRoll">
            </a-entity>

            <a-entity
                gltf-model="#painBalm"
                id="painBalmObject"
                rotation="0 45 0"
                position="0.3 -0.26 0"
                scale="0.005 0.005 0.005"
                draggable-object="target: [mindar-image-target]; itemName: painBalm">
            </a-entity>

            <a-entity
                gltf-model="#paracetamol"
                id="paracetamolObject"
                rotation="0 -45 0"
                position="0.1 -0.24 0"
                scale="0.03 0.03 0.03"
                draggable-object="target: [mindar-image-target]; itemName: paracetamol">
            </a-entity>

            <a-entity
                gltf-model="#sprit"
                id="spritObject"
                rotation="0 45 0"
                position="0.3 0.04 0"
                scale="0.02 0.02 0.02"
                draggable-object="target: [mindar-image-target]; itemName: sprit">
            </a-entity>

            <a-entity
                gltf-model="#thermometer"
                id="thermometerObject"
                position="0.1 0.01 0"
                rotation="90 0 0"
                scale="2 2 2"
                draggable-object="target: [mindar-image-target]; itemName: thermometer">
            </a-entity>

            <!-- Blood Hand Scenario Model -->
            <a-entity
                id="scenarioBloodHand"
                position="0 0 0.1"
                visible="false">
                <a-entity
                    gltf-model="#bloodHand"
                    rotation="90 0 0"
                    position="0 -0.28 0"
                    scale="0.02 0.02 0.02">
                </a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- ============================================================ -->
    <!-- Markerless (WebXR hit-test) AR Scene - used ONLY for Scenario mode.
         Completely separate from markerScene above so the marker-based
         experience is never touched by this. Hidden until Scenario is picked. -->
    <!-- ============================================================ -->
    <a-scene
        id="markerlessScene"
        style="display: none;"
        webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #markerlessOverlay;"
        ar-hit-test="target: #scenarioBloodHandMarkerless; type: footprint;"
        renderer="colorManagement: true; alpha: true;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item
                id="bloodHandMarkerless"
                src="assets/models/blood_hand.glb">
            </a-asset-item>
        </a-assets>

        <!-- look-controls left ENABLED here (unlike the marker scene) on purpose:
             - during a real WebXR AR session A-Frame ignores it and uses the device's
               true pose instead, so it's harmless there.
             - when there's no WebXR session (the AR-lite fallback below), this is what
               drives the "magic window" gyro-based look-around over the camera feed. -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: true">
        </a-camera>

        <!-- Placed on the detected surface once the user taps the reticle.
             Starts hidden - ar-hit-test shows it automatically after placement. -->
        <a-entity
            id="scenarioBloodHandMarkerless"
            gltf-model="#bloodHandMarkerless"
            rotation="0 0 0"
            scale="0.02 0.02 0.02"
            visible="false">
        </a-entity>

    </a-scene>

    <!-- Camera passthrough for the AR-lite fallback (no WebXR/ARCore needed).
         Sits behind the transparent markerlessScene canvas. Hidden unless the
         fallback path is actually used. -->
    <video
        id="markerlessFallbackVideo"
        autoplay
        muted
        playsinline
        style="display: none;">
    </video>

    <!-- HTML overlay shown on top of the markerless AR session (WebXR dom-overlay).
         Regular page HTML is not visible during an immersive AR session unless
         it lives inside the designated overlay element, so the Scenario buttons
         live here instead of floating divs appended by app.js. -->
    <div id="markerlessOverlay" style="display: none;">
        <button id="exitScenarioButton">
            Exit Scenario
        </button>
        <button id="placeHereButton" style="display: none;">
            Place Here
        </button>
        <button id="scenarioQuestionButton" style="display: none;">
            What do you use with this hand wound?
        </button>
    </div>

    <script src="app.js"></script>

</body>
</html>
