<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR First-Aid Kit Trainer</title>

    <!-- Importing A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Importing MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<!-- Rotate the 3D model using mouse drag events. -->
<body>
    
    <div id="modeSelector">
        <h1 id="modeSelectorTitle">AR First-Aid Kit Trainer</h1>
        <p id="modeSelectorSubtitle">Choose an AR mode to begin</p>
        <div id="modeSelectorButtons">
            <button id="markerModeBtn" class="mode-button">
                Marker-Based AR
            </button>
            <button id="markerlessModeBtn" class="mode-button" data-variant="markerless">
                Markerless AR (WebXR Test)
            </button>
        </div>
    </div>

    <!--Button to start traininig-->
    <button id="startTraining">
        Start Training
    </button>

    <!-- Container for training mode buttons -->
    <div id="trainingButtonsContainer" class="button-container">
        <button id="viewItemsButton" class="training-button">
            View Items
        </button>
    </div>

    <!-- Instruction button that appears when item is placed -->
    <button id="instructionButton" >
        Apply item
    </button>

    <!-- Marker-based Scene -->
    <a-scene
        id="markerScene"
        style="display: none;"
        mindar-image="imageTargetSrc: ./new_target.mind; autoStart: false;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Load the background image and all the asset models-->
        <a-assets>
            <img
                id="shelfImage"
                src="assets/images/new_marker.jpg">

            <a-asset-item
                id="firstAidBox"
                src="assets/models/first_aid_box_0_1.glb">
            </a-asset-item>

            <a-asset-item
                id="bandAid"
                src="assets/models/band_aid_box.glb">
            </a-asset-item>

            <a-asset-item
                id="bandageRoll"
                src="assets/models/bandage_roll.glb">
            </a-asset-item>

            <a-asset-item
                id="painBalm"
                src="assets/models/pain_balm.glb">
            </a-asset-item>

            <a-asset-item
                id="paracetamol"
                src="assets/models/paracetamol.glb">
            </a-asset-item>

            <a-asset-item
                id="sprit"
                src="assets/models/sprit.glb">
            </a-asset-item>

            <a-asset-item
                id="thermometer"
                src="assets/models/thermometer.glb">
            </a-asset-item>

            <a-asset-item
                id="bloodHand"
                src="assets/models/blood_hand.glb">
            </a-asset-item>
        </a-assets>

        <!--Add the camera in the center-->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">

            <a-entity
                cursor="rayOrigin: mouse"
                raycaster="objects: .draggable; far: 1000">
            </a-entity>

        </a-camera>

        <!--Initialize the placements of all the entities in the 3D scene-->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <a-image
                src="#shelfImage"
                position="0 0 0"
                width="1"
                height="0.6">
            </a-image>

            <a-entity
                gltf-model="#firstAidBox"
                position="-0.3 -0.06 0"
                scale="0.5 0.5 0.5">
            </a-entity>

            <a-entity
                id="bandAidObject"
                position="0.1 -0.13 0"
                scale="0.008 0.008 0.008"
                draggable-object="target: [mindar-image-target]; itemName: bandAid">

                <a-entity
                    gltf-model="#bandAid">
                </a-entity>

                <a-box
                    class="draggable"
                    width="10"
                    height="10"
                    depth="10"
                    material="transparent: true; opacity: 0; depthWrite: false">
                </a-box>

            </a-entity>

            <!-- Podium that appears when training starts -->
            <a-entity
                id="podium"
                position="-0.1 -0.3 0.2"
                visible="false">
                
                <!-- Podium base -->
                <a-box
                    id="podiumBase"
                    width="0.1"
                    height="0.15"
                    depth="0.3"
                    material="color: #4CAF50; metalness: 0.3; roughness: 0.7">
                </a-box>
                
                <!-- Podium top surface (drop zone) -->
                <a-cylinder
                    id="podiumTop"
                    radius="0.15"
                    height="0.02"
                    position="0 0.08 0"
                    material="color: #45a049; emissive: #1a3a1a; metalness: 0.5">
                </a-cylinder>

            </a-entity>

            <a-entity
                gltf-model="#bandageRoll"
                id="bandageRollObject"
                rotation="0 45 0"
                position="0.3 -0.09 0"
                scale="0.05 0.05 0.05"
                draggable-object="target: [mindar-image-target]; itemName: bandageRoll">
            </a-entity>

            <a-entity
                gltf-model="#painBalm"
                id="painBalmObject"
                rotation="0 45 0"
                position="0.3 -0.26 0"
                scale="0.005 0.005 0.005"
                draggable-object="target: [mindar-image-target]; itemName: painBalm">
            </a-entity>

            <a-entity
                gltf-model="#paracetamol"
                id="paracetamolObject"
                rotation="0 -45 0"
                position="0.1 -0.24 0"
                scale="0.03 0.03 0.03"
                draggable-object="target: [mindar-image-target]; itemName: paracetamol">
            </a-entity>

            <a-entity
                gltf-model="#sprit"
                id="spritObject"
                rotation="0 45 0"
                position="0.3 0.04 0"
                scale="0.02 0.02 0.02"
                draggable-object="target: [mindar-image-target]; itemName: sprit">
            </a-entity>

            <a-entity
                gltf-model="#thermometer"
                id="thermometerObject"
                position="0.1 0.01 0"
                rotation="90 0 0"
                scale="2 2 2"
                draggable-object="target: [mindar-image-target]; itemName: thermometer">
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- ============================================================ -->
    <!-- Markerless (WebXR hit-test) AR Scene - used ONLY for the in-training
         "Scenario" button above. Completely separate from markerScene above
         so the marker-based experience is never touched by this. Hidden
         until Scenario is picked.

         ar-hit-test targets #reticle: A-Frame automatically moves/shows/hides
         #reticle every frame to track wherever the device's camera is
         currently detecting a real-world surface. When the user taps the
         screen while a surface is detected, the scene fires
         'ar-hit-test-select' - that's when we actually drop #placedModel
         (a plain box, kept simple on purpose so you can quickly tell
         whether hit-test itself works on a given phone). -->
    <!-- ============================================================ -->
    <a-scene
        id="markerlessScene"
        style="display: none;"
        webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #markerlessOverlay;"
        ar-hit-test="target: #reticle; type: footprint;"
        renderer="colorManagement: true; alpha: true;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <!-- First Aid Box model for placement -->
            <a-asset-item
                id="firstAidBoxMarkerless"
                src="assets/models/first_aid_box_0_1.glb">
            </a-asset-item>
        </a-assets>

        <!-- look-controls left ENABLED here (unlike the marker scene) on purpose:
             - during a real WebXR AR session A-Frame ignores it and uses the device's
               true pose instead, so it's harmless there.
             - when there's no WebXR session (the AR-lite fallback below), this is what
               drives the "magic window" gyro-based look-around over the camera feed. -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: true">
        </a-camera>

        <!-- Add lighting so models are visible -->
        <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1" position="5 5 5"></a-light>

        <!-- Reticle - a flat ring that ar-hit-test moves onto whatever real
             surface the camera is currently detecting. Visible only while a
             surface is actively found; disappears once something is placed. -->
        <a-entity
            id="reticle"
            geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.07; segmentsTheta: 32"
            material="color: #4CAF50; shader: flat; side: double"
            rotation="-90 0 0"
            visible="false">
        </a-entity>

        <!-- Placed model - the first aid box GLB that appears when user taps -->
        <a-entity
            id="placedModel"
            gltf-model="#firstAidBoxMarkerless"
            scale="1 1 1"
            visible="false">
        </a-entity>

    </a-scene>

    <!-- HTML overlay shown on top of the markerless AR session (WebXR dom-overlay).
         Regular page HTML is not visible during an immersive AR session unless
         it lives inside the designated overlay element, so the Scenario buttons
         live here instead of floating divs appended by app.js. -->
    <div id="markerlessOverlay" style="display: none;">
        <button id="exitScenarioButton">
            Exit Scenario
        </button>
        <button id="scenarioQuestionButton" style="display: none;">
            What do you use with this hand wound?
        </button>
        <!-- Tells you in plain text whether this device supports real WebXR
             hit-test AR, or whether it dropped to the AR-lite fallback. -->
        <div id="arStatusMessage"></div>
    </div>

    <!-- ============================================================ -->
    <!-- Standalone Markerless WebXR AR compatibility test. This is the
         exact snippet you shared, wired up so it only starts once the
         user taps "Markerless AR" on the mode selector above. It is a
         fully separate three.js + ARButton experience - it does NOT touch
         or reuse the marker scene or the in-training Scenario mode above. -->
    <!-- ============================================================ -->
    <div id="webxrTestContainer" style="display: none;">
        <div id="webxrTestStatus">Checking WebXR...</div>
        <button id="webxrTestStart">Start AR</button>
    </div>

    <script src="app.js"></script>
    <script type="module" src="webxrTest.js"></script>

</body>
</html>
