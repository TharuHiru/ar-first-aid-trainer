<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR First-Aid Kit Trainer</title>

    <!-- Importing A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Importing MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<!-- Rotate the 3D model using mouse drag events. -->
<script>
AFRAME.registerComponent('mouse-rotate', {
    init: function () {
        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;

        this.el.sceneEl.canvas.addEventListener('mousedown', (e) => {
            this.dragging = true;
            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            this.dragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!this.dragging) return;

            const dx = e.clientX - this.lastX;
            const dy = e.clientY - this.lastY;

            const rotation = this.el.getAttribute('rotation');

            rotation.y += dx * 0.5;
            rotation.x += dy * 0.5;

            this.el.setAttribute('rotation', rotation);

            this.lastX = e.clientX;
            this.lastY = e.clientY;
        });
    }
});
</script>

<body>

    <a-scene
        mindar-image="imageTargetSrc: ./new_target.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img
                id="shelfImage"
                src="assets/images/new_marker.jpg">

            <!-- The first item the first aid box so we load it and give it a name-->
            <a-asset-item
                id="firstAidBox"
                src="assets/models/first_aid_box_0_1.glb">
            </a-asset-item>

             <a-asset-item
                id="bandageRoll"
                src="assets/models/bandage_roll.glb">
            </a-asset-item>
        </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity
        mindar-image-target="targetIndex: 0">

        <a-image
            src="#shelfImage"
            position="0 0 0"
            width="1"
            height="0.6">
        </a-image>

        <a-entity
            gltf-model="#firstAidBox"
            position="-0.3 -0.06 0"
            scale="0.5 0.5 0.5"
            mouse-rotate>
        </a-entity>

        <a-entity
            gltf-model="#bandageRoll"
            rotation="0 90 0"
            position="0.3 -0.09 0"
            scale="0.05 0.05 0.05"
            mouse-rotate>
        </a-entity>

    </a-entity>

</a-scene>

    <script src="app.js"></script>

</body>
</html>
